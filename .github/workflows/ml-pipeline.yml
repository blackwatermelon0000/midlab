name: ML Pipeline

on:
  push:
    branches: [ main, master ]
    paths:
      - 'dataset/**'

jobs:
  train-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Train the Model
        run: python train.py

      - name: Show Accuracy
        run: cat metrics.json